name: Frontend checks

# Browser tests run the site against the real backend and a seeded database,
# so changes to the backend and content/ trigger them too.
on:
  # main is checked by deploy.yml, which calls this workflow before deploying.
  push:
    branches-ignore: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'content/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'content/**'
      - '.github/workflows/frontend.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The official Playwright image already has Chromium and the system libraries it needs:
    # nothing is installed by apt, which on the runner sometimes took minutes or failed.
    # Its version must match @playwright/test in package-lock.json (checked below).
    # --ipc=host: Docker gives a container 64 MB of shared memory, too little for Chromium with
    # several pages (pages crash, tests time out). --init reaps the browsers' child processes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: k_ci
          POSTGRES_PASSWORD: k_ci_password
          POSTGRES_DB: k_ci
        options: >-
          --health-cmd "pg_isready -U k_ci -d k_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the CI database only; they are not secrets.
    # Inside the job container the database service is reached by its name, «postgres».
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://k_ci:k_ci_password@postgres:5432/k_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      VITE_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      # The image's browsers belong to one Playwright version: it must be the one in package-lock.json.
      - name: The image has the browser this Playwright needs
        run: |
          node -e "
            const { chromium } = require('@playwright/test');
            if (!require('node:fs').existsSync(chromium.executablePath())) {
              console.log('::error::No browser for @playwright/test ' + require('@playwright/test/package.json').version + ' in the job image: set its version in container.image');
              process.exit(1);
            }"
      - run: npm run check
      - run: npm run build
      - name: Prepare backend and database
        working-directory: backend
        run: |
          npm ci
          npm run build
          node dist/db/migrate.js
          node dist/db/seed.js
      # Playwright starts the built backend and serves the build above with vite preview.
      - run: npm test
