name: Frontend checks

# Browser tests run the site against the real backend and a seeded database,
# so changes to the backend and content/ trigger them too.
on:
  # main is checked by deploy.yml, which calls this workflow before deploying.
  push:
    branches-ignore: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'content/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'content/**'
      - '.github/workflows/frontend.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: k_ci
          POSTGRES_PASSWORD: k_ci_password
          POSTGRES_DB: k_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U k_ci -d k_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the CI database only; they are not secrets.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://k_ci:k_ci_password@localhost:5432/k_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      VITE_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Prepare backend and database
        working-directory: backend
        run: |
          npm ci
          npm run build
          node dist/db/migrate.js
          node dist/db/seed.js
      # The browser is cached per Playwright version; the system libraries it needs are not
      # part of the cache and are installed by apt on every run.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # Usually ~20 s; a stalled download or apt mirror fails fast instead of hanging.
      - if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 4
        run: npx playwright install-deps chromium
      # Playwright starts the built backend and serves the build above with vite preview.
      - run: npm test
