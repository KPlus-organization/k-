name: Deploy

# Every push to main: run the checks, build images into GitHub Container Registry,
# then update the server over SSH. Setup and rollback: deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of interrupting a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-checks:
    uses: ./.github/workflows/backend.yml

  frontend-checks:
    uses: ./.github/workflows/frontend.yml

  images:
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        # Registry names must be lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/k-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Links the package to this repository, so the deploy job's token may pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_DIR: /opt/k-
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF
      - name: Upload compose file
        run: scp deploy/docker-compose.yml "server:$DEPLOY_DIR/docker-compose.yml"
      - name: Pull images and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The token goes through stdin, so it never appears in the server's process list.
        # It expires when this job ends; the server logs out right after pulling anyway.
        # IMAGE_PREFIX is computed as in the images job and overrides the one in the server's
        # .env, so a renamed or transferred repository keeps deploying.
        run: |
          printf '%s' "$TOKEN" | ssh server "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh server "cd $DEPLOY_DIR \
            && export IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,} TAG=${{ github.sha }} \
            && docker compose pull --quiet; status=\$?; docker logout ghcr.io; [ \$status -eq 0 ] \
            && docker compose up -d --remove-orphans --wait --wait-timeout 180 \
            && docker image prune -af"
