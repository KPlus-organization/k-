# Государственные пошлины за регистрацию программ для ЭВМ и баз данных —
# данные калькулятора пошлин на сайте.
#
# Файл заполняют и проверяют юристы. Правила — в content/README.md, раздел «Пошлины».
# После правки запустите в backend/: npm run db:seed — ошибки будут показаны по-русски.

название: Программы для ЭВМ и базы данных
порядок: 2   # место вкладки в калькуляторе
основание: >-
  Налоговый кодекс Российской Федерации, статья 333.30, пункт 1, в редакции Федерального
  закона от 23.11.2024 № 389-ФЗ
ссылка_на_основание: https://www.consultant.ru/cons/cgi/online.cgi?req=doc&base=LAW&n=538093&dst=27043
действует_с: 2025-01-01
ссылка_на_пункт: подпункт {пункт} пункта 1 статьи 333.30 НК РФ   # как на сайте называть пункт
проверил: ""   # ФИО юриста и дата сверки с текстом статьи, например: Иванова И. И., 20.10.2026
примечание: >-
  Пошлина одинакова для организаций и физических лиц. Те же размеры применяются к топологиям
  интегральных микросхем.

параметры:
  объекты:
    вопрос: Количество программ для ЭВМ и баз данных
    тип: число
    от: 1
    до: 1000

пошлины:

  - пункт: "1"
    раздел: Регистрация
    название: Регистрация программы для ЭВМ или базы данных
    формулировка: >-
      за рассмотрение заявки на государственную регистрацию программы для ЭВМ, базы данных или
      топологии интегральной микросхемы и принятие решения по результатам рассмотрения заявки
    ссылка: https://www.consultant.ru/cons/cgi/online.cgi?req=doc&base=LAW&n=538093&dst=27045
    сумма: 5 000
    примеры:
      - { итог: 5 000 }

  - пункт: "2"
    раздел: Изменения в реестре
    название: Изменения в Реестре программ для ЭВМ или Реестре баз данных
    формулировка: >-
      за рассмотрение заявления правообладателя о внесении изменений в Реестр программ для ЭВМ,
      Реестр баз данных или Реестр топологий интегральных микросхем и принятие решения по
      результатам рассмотрения заявления
    ссылка: https://www.consultant.ru/cons/cgi/online.cgi?req=doc&base=LAW&n=538093&dst=27046
    сумма: 0
    доплаты:
      - за: каждую программу для ЭВМ или базу данных
        параметр: объекты
        сумма: 3 000
    примеры:
      - { объекты: 1, итог: 3 000 }
      - { объекты: 3, итог: 9 000 }

  - пункт: "3"
    раздел: Распоряжение исключительным правом
    название: Регистрация отчуждения или залога исключительного права по договору
    формулировка: >-
      за рассмотрение заявления о государственной регистрации отчуждения исключительного права на
      зарегистрированные программу для ЭВМ, базу данных или топологию интегральной микросхемы по
      договору, залога такого права по договору или предоставления права использования
      зарегистрированной топологии интегральной микросхемы по договору, о внесении изменений в
      зарегистрированное распоряжение исключительным правом по соответствующему договору либо о
      прекращении зарегистрированного распоряжения исключительным правом по договору о
      предоставлении права использования или о залоге исключительного права на зарегистрированные
      программу для ЭВМ, базу данных или топологию интегральной микросхемы и принятие решения по
      результатам рассмотрения заявления
    ссылка: https://www.consultant.ru/cons/cgi/online.cgi?req=doc&base=LAW&n=538093&dst=27047
    сумма: 5 000
    доплаты:
      - за: каждую программу для ЭВМ или базу данных по договору сверх одной
        параметр: объекты
        сверх: 1
        сумма: 3 000
    примеры:
      - { объекты: 1, итог: 5 000 }
      - { объекты: 4, итог: 14 000 }

  - пункт: "4"
    раздел: Распоряжение исключительным правом
    название: Регистрация перехода исключительного права без договора
    формулировка: >-
      за рассмотрение заявления о государственной регистрации перехода исключительного права на
      зарегистрированные программу для ЭВМ, базу данных или топологию интегральной микросхемы к
      другому лицу без договора и принятие решения по результатам рассмотрения заявления
    ссылка: https://www.consultant.ru/cons/cgi/online.cgi?req=doc&base=LAW&n=538093&dst=27048
    сумма: 5 000
    доплаты:
      - за: каждую программу для ЭВМ или базу данных в заявлении сверх одной
        параметр: объекты
        сверх: 1
        сумма: 3 000
    примеры:
      - { объекты: 2, итог: 8 000 }
