# Пошлины за действия с товарными знаками — данные калькулятора пошлин на сайте.
#
# Файл заполняют и проверяют юристы. Правила — в content/README.md, раздел «Пошлины».
# Коротко:
#   - «сумма» — основная пошлина в рублях; пробелы в числах допустимы: 18 000;
#   - «доплаты» — сколько добавить за каждую единицу параметра сверх порога («сверх»);
#   - «формулировка» — дословный текст пункта Положения, показывается пользователю;
#   - «примеры» — контрольные расчёты: при проверке сумма по формуле должна совпасть с «итог».
# После правки запустите в backend/: npm run db:seed — ошибки будут показаны по-русски.

название: Товарные знаки
порядок: 1   # место вкладки в калькуляторе
основание: >-
  Положение о патентных и иных пошлинах за совершение юридически значимых действий
  (утверждено постановлением Правительства РФ от 10.12.2008 № 941), приложение № 1,
  раздел 2, в редакции постановления Правительства РФ от 23.09.2025 № 1459
действует_с: 2025-10-04
ссылка_на_пункт: подпункт {пункт} приложения № 1 к Положению   # как на сайте называть пункт
проверил: ""   # ФИО юриста и дата сверки с текстом Положения, например: Иванова И. И., 20.10.2026
примечание: >-
  Льготы (уменьшенные пошлины) для действий с товарными знаками Положением не предусмотрены.

# Вопросы, которые калькулятор задаёт пользователю.
# Типы: число (от/до), да_нет, по_классам (отдельное число для каждого класса МКТУ).
параметры:
  классы:
    вопрос: Количество классов МКТУ
    тип: число
    от: 1
    до: 45
  товары_в_классе:
    вопрос: Количество товаров и услуг в каждом классе
    тип: по_классам
    от: 1
    до: 1000
  бумажное_свидетельство:
    вопрос: Нужно свидетельство на бумаге
    тип: да_нет
  месяцы_продления:
    вопрос: На сколько месяцев продлить срок
    тип: число
    от: 1
    до: 6
  изменения:
    вопрос: Количество изменений (по каждому товарному знаку считаются отдельно)
    тип: число
    от: 1
    до: 100

пошлины:

  # ———— Подача заявки и экспертиза ————

  - пункт: "2.1"
    раздел: Подача заявки и экспертиза
    название: Подача заявки на товарный знак (регистрация заявки и формальная экспертиза)
    формулировка: >-
      Регистрация заявки на регистрацию товарного знака, знака обслуживания (далее - заявка на
      товарный знак) и принятие решения по заявке на товарный знак по результатам формальной
      экспертизы
    сумма: 4 000
    доплаты:
      - за: каждый класс МКТУ сверх первого
        параметр: классы
        сверх: 1
        сумма: 1 000
    примеры:
      - { классы: 1, итог: 4 000 }
      - { классы: 3, итог: 6 000 }

  - пункт: "2.2"
    раздел: Подача заявки и экспертиза
    название: Выделенная заявка на товарный знак
    формулировка: >-
      Регистрация заявки, выделенной из первоначальной заявки на товарный знак, проведение
      экспертизы и принятие решения по заявке на товарный знак
    сумма: 4 000
    доплаты:
      - за: каждый класс МКТУ свыше 5
        параметр: классы
        сверх: 5
        сумма: 1 000
    примеры:
      - { классы: 3, итог: 4 000 }
      - { классы: 7, итог: 6 000 }

  - пункт: "2.4"
    раздел: Подача заявки и экспертиза
    название: Экспертиза обозначения, заявленного в качестве товарного знака
    формулировка: >-
      Проведение экспертизы обозначения, заявленного в качестве товарного знака, и принятие
      решения по ее результатам
    сумма: 13 000
    доплаты:
      - за: каждый класс МКТУ сверх первого
        параметр: классы
        сверх: 1
        сумма: 2 500
      - за: каждый товар или услугу сверх десяти в одном классе
        параметр: товары_в_классе
        сверх: 10
        сумма: 500
    примеры:
      - { классы: 1, товары_в_классе: [10], итог: 13 000 }
      - { классы: 3, товары_в_классе: [15, 10, 4], итог: 20 500 }

  # ———— Изменения и сроки по заявке ————

  - пункт: "2.6.1"
    раздел: Изменения и сроки по заявке
    название: "Изменение заявки: включение дополнительного класса, выделенного из перечня"
    формулировка: >-
      Рассмотрение ходатайства о внесении изменений в заявку на товарный знак, принятие решения
      по результатам его рассмотрения: если изменение перечня связано с включением
      дополнительного класса, выделенного из заявленного перечня товаров и услуг
    сумма: 5 000

  - пункт: "2.6.2"
    раздел: Изменения и сроки по заявке
    название: "Изменение заявки: передача права на регистрацию другому лицу"
    формулировка: >-
      Рассмотрение ходатайства о внесении изменений в заявку на товарный знак, принятие решения
      по результатам его рассмотрения: если изменение сведений о заявителе связано с передачей
      права на регистрацию товарного знака другому лицу
    сумма: 3 000

  - пункт: "2.7.1"
    раздел: Изменения и сроки по заявке
    название: Продление срока представления документов и материалов по заявке
    формулировка: >-
      Рассмотрение ходатайства о продлении установленного законодательством Российской Федерации
      срока, принятие решения по результатам его рассмотрения: продление срока представления
      исправленных или недостающих документов, запрашиваемых дополнительных материалов по заявке
      на товарный знак, заявке на географическое указание, наименование места происхождения
      товара
    сумма: 0
    доплаты:
      - за: каждый месяц продления
        параметр: месяцы_продления
        сумма: 3 000
    примеры:
      - { месяцы_продления: 4, итог: 12 000 }

  - пункт: "2.7.2"
    раздел: Изменения и сроки по заявке
    название: Продление срока сообщения о выборе заявки на тождественный знак
    формулировка: >-
      Рассмотрение ходатайства о продлении установленного законодательством Российской Федерации
      срока, принятие решения по результатам его рассмотрения: продление срока представления
      сообщения о выборе заявки на тождественный товарный знак, по которой испрашивается
      регистрация товарного знака
    сумма: 0
    доплаты:
      - за: каждый месяц продления
        параметр: месяцы_продления
        сумма: 3 000
    примеры:
      - { месяцы_продления: 6, итог: 18 000 }

  - пункт: "2.8.1"
    раздел: Изменения и сроки по заявке
    название: Восстановление срока представления документов и материалов
    формулировка: >-
      Рассмотрение ходатайства о восстановлении пропущенного заявителем установленного
      законодательством Российской Федерации срока и принятие решения по результатам его
      рассмотрения: восстановление срока представления исправленных и (или) недостающих
      документов, запрашиваемых дополнительных материалов
    сумма: 11 000

  - пункт: "2.8.2"
    раздел: Изменения и сроки по заявке
    название: Восстановление срока подачи возражения
    формулировка: >-
      Рассмотрение ходатайства о восстановлении пропущенного заявителем установленного
      законодательством Российской Федерации срока и принятие решения по результатам его
      рассмотрения: восстановление срока подачи возражения в федеральный орган исполнительной
      власти по интеллектуальной собственности
    сумма: 11 000

  - пункт: "2.9"
    раздел: Изменения и сроки по заявке
    название: Преобразование заявки на товарный знак в заявку на коллективный знак и наоборот
    формулировка: >-
      Рассмотрение заявления о преобразовании заявки на товарный знак в заявку на коллективный
      знак и наоборот и принятие решения по результатам его рассмотрения
    сумма: 3 000

  # ———— Регистрация и свидетельство ————

  - пункт: "2.11"
    раздел: Регистрация и свидетельство
    название: Регистрация товарного знака и выдача электронного свидетельства
    формулировка: >-
      Регистрация товарного знака и выдача свидетельства в форме электронного документа
    сумма: 18 000
    доплаты:
      - за: каждый класс МКТУ свыше 5
        параметр: классы
        сверх: 5
        сумма: 2 000
    примеры:
      - { классы: 1, итог: 18 000 }
      - { классы: 7, итог: 22 000 }

  - пункт: "2.12"
    раздел: Регистрация и свидетельство
    название: Регистрация коллективного знака и выдача электронного свидетельства
    формулировка: >-
      Регистрация коллективного знака и выдача свидетельства в форме электронного документа
    сумма: 22 000
    доплаты:
      - за: каждый класс МКТУ свыше 5
        параметр: классы
        сверх: 5
        сумма: 2 000
    примеры:
      - { классы: 6, итог: 24 000 }

  - пункт: "2.14"
    раздел: Регистрация и свидетельство
    название: Выдача свидетельства на бумаге
    формулировка: >-
      Выдача на бумажном носителе по ходатайству правообладателя свидетельства на товарный знак,
      коллективный знак, общеизвестный товарный знак, свидетельства об исключительном праве на
      географическое указание, свидетельства об исключительном праве на наименование места
      происхождения товара
    сумма: 3 000

  - пункт: "2.15"
    раздел: Регистрация и свидетельство
    название: Выдача дубликата свидетельства
    формулировка: >-
      Рассмотрение ходатайства о выдаче дубликата свидетельства и принятие решения по
      результатам его рассмотрения
    сумма: 2 000
    доплаты:
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { бумажное_свидетельство: да, итог: 5 000 }
      - { бумажное_свидетельство: нет, итог: 2 000 }

  # ———— Изменения и продление зарегистрированного знака ————

  - пункт: "2.16"
    раздел: Изменения и продление зарегистрированного знака
    название: Изменения в Государственном реестре товарных знаков
    формулировка: >-
      Рассмотрение заявления правообладателя о внесении изменений в Государственный реестр
      товарных знаков и знаков обслуживания Российской Федерации, в Государственный реестр
      географических указаний и наименований мест происхождения товаров Российской Федерации, в
      том числе сведений, касающихся правообладателя, адреса для переписки, сокращения перечня
      товаров и услуг, для индивидуализации которых зарегистрирован товарный знак, изменений
      отдельных элементов товарного знака, а также исправлений очевидных и технических ошибок
      (допущенных заявителем), и принятие решения по результатам его рассмотрения
    сумма: 0
    доплаты:
      - за: каждое изменение по одному товарному знаку
        параметр: изменения
        сумма: 3 000
    примеры:
      - { изменения: 2, итог: 6 000 }

  - пункт: "2.17"
    раздел: Изменения и продление зарегистрированного знака
    название: Изменения в свидетельстве на товарный знак
    формулировка: >-
      Рассмотрение заявления правообладателя о внесении изменений в свидетельство на товарный
      знак, свидетельство на коллективный знак, свидетельство об исключительном праве на
      географическое указание или наименование места происхождения товара, в том числе сведений,
      касающихся правообладателя, исправления очевидных и технических ошибок (допущенных
      заявителем), принятие решения по результатам рассмотрения заявления
    сумма: 2 000
    доплаты:
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { бумажное_свидетельство: да, итог: 5 000 }

  - пункт: "2.18"
    раздел: Изменения и продление зарегистрированного знака
    название: Изменения в Перечне общеизвестных товарных знаков
    формулировка: >-
      Рассмотрение заявления правообладателя о внесении изменений в Перечень общеизвестных в
      Российской Федерации товарных знаков
    сумма: 0
    доплаты:
      - за: каждое изменение по одному общеизвестному товарному знаку
        параметр: изменения
        сумма: 3 000
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { изменения: 1, бумажное_свидетельство: да, итог: 6 000 }

  - пункт: "2.19"
    раздел: Изменения и продление зарегистрированного знака
    название: Выделение отдельной регистрации товарного знака
    формулировка: >-
      Рассмотрение заявления правообладателя о выделении отдельной регистрации товарного знака
      из действующей регистрации товарного знака и принятие решения по результатам его
      рассмотрения
    сумма: 10 000
    доплаты:
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { бумажное_свидетельство: нет, итог: 10 000 }

  - пункт: "2.20"
    раздел: Изменения и продление зарегистрированного знака
    название: Преобразование товарного знака в коллективный знак
    формулировка: >-
      Рассмотрение заявления о преобразовании товарного знака в коллективный знак, наименования
      места происхождения товара в географическое указание, географического указания в
      наименование места происхождения товара и принятие решения по результатам его рассмотрения
    сумма: 10 000
    доплаты:
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { бумажное_свидетельство: да, итог: 13 000 }

  - пункт: "2.21"
    раздел: Изменения и продление зарегистрированного знака
    название: Преобразование коллективного знака в товарный знак
    формулировка: >-
      Рассмотрение заявления о преобразовании коллективного знака в товарный знак и принятие
      решения по результатам его рассмотрения
    сумма: 7 000
    доплаты:
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { бумажное_свидетельство: нет, итог: 7 000 }

  - пункт: "2.22"
    раздел: Изменения и продление зарегистрированного знака
    название: Продление срока действия исключительного права на товарный знак
    формулировка: >-
      Рассмотрение заявления о продлении срока действия исключительного права на товарный знак и
      принятие решения по результатам его рассмотрения
    сумма: 22 000
    доплаты:
      - за: каждый класс МКТУ свыше 5
        параметр: классы
        сверх: 5
        сумма: 2 000
      - за: каждый товар или услугу сверх десяти в одном классе
        параметр: товары_в_классе
        сверх: 10
        сумма: 500
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { классы: 6, товары_в_классе: [12, 1, 1, 1, 1, 11], бумажное_свидетельство: да, итог: 28 500 }
      - { классы: 1, товары_в_классе: [3], бумажное_свидетельство: нет, итог: 22 000 }

  - пункт: "2.23"
    раздел: Изменения и продление зарегистрированного знака
    название: Продление срока действия исключительного права на коллективный знак
    формулировка: >-
      Рассмотрение заявления о продлении срока действия исключительного права на коллективный
      знак и принятие решения по результатам его рассмотрения
    сумма: 30 000
    доплаты:
      - за: каждый класс МКТУ свыше 5
        параметр: классы
        сверх: 5
        сумма: 2 000
      - за: выдачу свидетельства на бумаге
        параметр: бумажное_свидетельство
        сумма: 3 000
    примеры:
      - { классы: 5, бумажное_свидетельство: нет, итог: 30 000 }

  - пункт: "2.25"
    раздел: Изменения и продление зарегистрированного знака
    название: Дополнительный 6-месячный срок для подачи заявления о продлении
    формулировка: >-
      Рассмотрение ходатайства о предоставлении дополнительного 6-месячного срока для подачи
      заявления о продлении срока действия исключительного права на товарный знак, коллективный
      товарный знак, заявления о продлении срока действия исключительного права на
      географическое указание или наименование места происхождения товара и принятие решения по
      результатам его рассмотрения
    сумма: 3 000

  - пункт: "2.26"
    раздел: Изменения и продление зарегистрированного знака
    название: Заверенные копии документов заявки
    формулировка: >-
      Рассмотрение ходатайства о выдаче заверенных копий документов заявки на государственную
      регистрацию товарного знака, знака обслуживания, коллективного товарного знака, заявки на
